<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Address Monitor</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-3xl rounded-3xl border border-zinc-800 bg-zinc-950 shadow-2xl p-8">

    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold tracking-tight mb-2">
          Bitcoin Address Monitor
        </h1>

        <p id="address" class="text-zinc-400 text-sm break-all"></p>
      </div>

      <div class="h-14 w-14 rounded-2xl bg-orange-500/20 flex items-center justify-center text-2xl">
        ₿
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-6">

      <div class="rounded-3xl bg-zinc-900 border border-zinc-800 p-6">
        <div class="text-zinc-400 text-sm mb-3">
          当前余额
        </div>

        <div id="btcBalance" class="text-4xl font-bold tracking-tight">
          --
        </div>

        <div class="text-orange-400 mt-2 text-lg">
          BTC
        </div>
      </div>

      <div class="rounded-3xl bg-zinc-900 border border-zinc-800 p-6">
        <div class="text-zinc-400 text-sm mb-3">
          当前美元价值
        </div>

        <div id="usdValue" class="text-4xl font-bold tracking-tight">
          --
        </div>

        <div class="text-green-400 mt-2 text-lg">
          USD
        </div>
      </div>

    </div>

    <div class="mt-8 grid md:grid-cols-2 gap-4">

      <div class="rounded-2xl bg-zinc-900/60 border border-zinc-800 p-4">
        <div class="text-zinc-500 text-xs mb-1">
          BTC 实时价格
        </div>

        <div id="btcPrice" class="text-xl font-semibold">
          --
        </div>
      </div>

      <div class="rounded-2xl bg-zinc-900/60 border border-zinc-800 p-4">
        <div class="text-zinc-500 text-xs mb-1">
          最后更新时间
        </div>

        <div id="updatedTime" class="text-xl font-semibold">
          --
        </div>
      </div>

    </div>

  </div>

<script>

const address = "bc1prgljdtxd7mkanjnggkz7345u9wm8c5vpsj7kxqne3786q7plhu9qdlemn5";

document.getElementById("address").innerText = address;

async function fetchData() {

  try {

    // BlockCypher 查询余额
    const balanceRes = await fetch(
      `https://api.blockcypher.com/v1/btc/main/addrs/${address}/balance`
    );

    const balanceData = await balanceRes.json();

    const sats = balanceData.final_balance || 0;

    const btc = sats / 100000000;

    // Coinbase 查询 BTC 美元价格
    const priceRes = await fetch(
      "https://api.coinbase.com/v2/prices/spot?currency=USD"
    );

    const priceData = await priceRes.json();

    const price = parseFloat(priceData.data.amount);

    const usd = btc * price;

    document.getElementById("btcBalance").innerText =
      btc.toFixed(8);

    document.getElementById("usdValue").innerText =
      "$" + usd.toLocaleString(undefined, {
        maximumFractionDigits: 2
      });

    document.getElementById("btcPrice").innerText =
      "$" + price.toLocaleString(undefined, {
        maximumFractionDigits: 2
      });

    document.getElementById("updatedTime").innerText =
      new Date().toLocaleTimeString();

  } catch (err) {

    console.error(err);

    document.getElementById("btcBalance").innerText = "API Error";
    document.getElementById("usdValue").innerText = "API Error";
    document.getElementById("btcPrice").innerText = "API Error";

  }

}

fetchData();

setInterval(fetchData, 30000);

</script>

</body>
</html>
